name: Bug report
description: Report a defect or unexpected behaviour of nette-auto-variable-template
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        If this is a security vulnerability, do not continue. Report it privately at https://github.com/tomaj/nette-auto-variable-template/security/advisories/new (see SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What went wrong?
      placeholder: A registered variable is missing in component templates when...
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: The services section of your config.neon that registers the factory (remove secrets).
      render: neon
      placeholder: |
        services:
            latte.templateFactory:
                autowired: no
            templateFactory:
                factory: Tomaj\Latte\AutoVariableTemplateFactory(@latte.templateFactory)
                setup:
                    - registerVariable('appName', 'My Application')
    validations:
      required: true

  - type: textarea
    id: code
    attributes:
      label: Code and template
      description: The smallest presenter, component or template that shows the problem.
      render: php
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead? Include the exception message if there is one.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: nette-auto-variable-template version
      description: The version from composer, for example 3.0.0.
      placeholder: "3.0.0"
    validations:
      required: true

  - type: input
    id: nette-version
    attributes:
      label: nette/application and latte/latte versions
      placeholder: "nette/application 3.2.9, latte/latte 3.1.1"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      description: Output of `php -v`.
      placeholder: "8.4"
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate
          required: true
        - label: This is not a security vulnerability
          required: true
